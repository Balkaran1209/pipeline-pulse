spring.application.name=pipeline-pulse
server.port=8080
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pipeline_pulse}
spring.datasource.username=${DB_USER:pipeline_pulse}
spring.datasource.password=${DB_PASSWORD:pipeline_pulse}
spring.datasource.hikari.connection-timeout=3000

spring.flyway.locations=classpath:db/migration