services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pipeline_pulse
      POSTGRES_USER: pipeline_pulse
      POSTGRES_PASSWORD: pipeline_pulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - 127.0.0.1
        - -U
        - pipeline_pulse
        - -d
        - pipeline_pulse
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pipeline_pulse
      DB_USER: pipeline_pulse
      DB_PASSWORD: pipeline_pulse
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "3"
        - http://localhost:8080/api/v1/health
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:3000/
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  seed:
    image: postgres:17
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGDATABASE: pipeline_pulse
      PGUSER: pipeline_pulse
      PGPASSWORD: pipeline_pulse
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./seed:/seed:ro
      - ./backend/scripts/seed.sql:/scripts/seed.sql:ro
    command:
      - psql
      - -X
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /scripts/seed.sql

volumes:
  postgres_data: